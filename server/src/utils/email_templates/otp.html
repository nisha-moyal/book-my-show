<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your OTP Code</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f4f4f4; font-family: Arial, sans-serif;">
    <table width="100%" cellpadding="0" cellspacing="0" style="padding: 20px 0;">
      <tr>
        <td align="center">
          <table width="480" cellpadding="0" cellspacing="0" style="background-color: #ffffff; border-radius: 8px; padding: 30px;">
            <tr>
              <td>
                <h2 style="margin-top: 0; color: #333333;">Hi #{name},</h2>
                <p style="color: #555555; font-size: 15px; line-height: 1.5;">
                  We received a request to reset your password. Use the OTP below to continue:
                </p>
                <div style="text-align: center; margin: 25px 0;">
                  <span style="display: inline-block; font-size: 28px; font-weight: bold; letter-spacing: 6px; color: #111111; background-color: #f0f0f0; padding: 12px 24px; border-radius: 6px;">
                    #{otp}
                  </span>
                </div>
                <p style="color: #555555; font-size: 14px; line-height: 1.5;">
                  This OTP is valid for 10 minutes. Do not share it with anyone.
                </p>
                <p style="color: #999999; font-size: 12px; margin-bottom: 0;">
                  If you did not request this, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
